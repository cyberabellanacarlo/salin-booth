<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:K;src:url('file:///usr/share/fonts/truetype/sand-box/google/Kalam/Kalam-Bold.ttf')}
@font-face{font-family:C;src:url('file:///usr/share/fonts/truetype/sand-box/google/Cormorant Garamond/CormorantGaramond-VariableFont_wght.ttf')}
body{margin:0;width:1080px;height:1350px;background:#F1ECE2;position:relative;overflow:hidden;font-family:C}
.fl{position:absolute;mix-blend-mode:multiply}
.card{position:absolute;left:70px;top:150px;width:940px;height:1000px;background:#FBF9F4;border-radius:6px;box-shadow:0 18px 40px rgba(60,55,40,.18),0 2px 6px rgba(60,55,40,.12);transform:rotate(-1.2deg)}
.ph{position:absolute;left:46px;top:46px;width:848px;height:700px;object-fit:cover;border-radius:2px}
.msg{position:absolute;left:0;right:0;top:770px;text-align:center;font-family:K;font-size:84px;color:#2F3A26;line-height:1.1}
.ul{position:absolute;left:250px;top:872px;width:440px;height:10px;border-radius:6px;background:#B08D57;transform:rotate(-2deg)}
.heart{color:#B08D57;font-family:sans-serif;font-size:76px}
.foot{position:absolute;left:0;right:0;bottom:46px;text-align:center}
.foot img{height:110px;mix-blend-mode:multiply}
.tag{font-size:26px;letter-spacing:6px;color:#3E4A33;margin-top:4px}
.date{position:absolute;right:300px;top:64px;font-size:30px;letter-spacing:4px;color:#8A7A5C;font-style:italic}
.top{position:absolute;left:70px;top:60px;font-size:30px;letter-spacing:8px;color:#3E4A33}
</style></head><body>
<img class="fl" src="flower_tr.png" style="right:-10px;top:-10px;width:230px">
<img class="fl" src="flower_bl.png" style="left:-10px;bottom:120px;width:270px">
<div class="top">SOUVENIR ALBUM</div><div class="date">Nov 2026</div>
<div class="card"><img class="ph" src="sample_photo.jpg">
<div class="msg">I'm lovin Salin! <span class="heart">&#10084;</span></div><div class="ul"></div></div>
<div class="foot"><img src="logo.png"><div class="tag">SUSTAINABLE · IMMERSIVE · MEMORABLE</div></div>
</body></html>
